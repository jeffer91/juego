name: Validar proyecto

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validacion-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Comprobar estructura, JSON y referencias
        run: python3 tools/validate_project.py

  prueba-godot:
    runs-on: ubuntu-latest
    needs: validacion-estatica
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Instalar utilidades
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Importar y probar el proyecto con Godot
        id: godot_test
        shell: bash
        run: |
          set +e
          bash tools/run_godot_smoke_test.sh > godot-test.log 2>&1
          status=$?
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' godot-test.log; then
            status=1
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -n 120 godot-test.log
          exit 0

      - name: Confirmar resultado de Godot
        if: steps.godot_test.outputs.status != '0'
        run: exit 1
