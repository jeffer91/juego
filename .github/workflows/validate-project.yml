name: Validar proyecto

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validacion-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Comprobar estructura, JSON y referencias
        run: python3 tools/validate_project.py

  prueba-godot:
    runs-on: ubuntu-latest
    needs: validacion-estatica
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar utilidades
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Importar y abrir el proyecto con Godot
        run: bash tools/run_godot_smoke_test.sh
