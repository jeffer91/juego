name: Corrección temporal de compilación

on:
  push:
    branches:
      - test/verificar-bloques-1-12

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v6
        with:
          ref: test/verificar-bloques-1-12
          fetch-depth: 0
          show-progress: false

      - name: Aplicar correcciones puntuales
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(path: Path, replacements: list[tuple[str, str]]) -> None:
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          main_game = Path("scripts/core/MainGame.gd")
          replace_all(main_game, [
              ("GameManager.current_level", "int(_game_manager().get(\"current_level\"))"),
              ("GameManager.get_state_name()", "str(_game_manager().call(\"get_state_name\"))"),
              ("GameManager.start_game(current_level)", "_game_manager().call(\"start_game\", current_level)"),
              ("GameManager.register_victory()", "_game_manager().call(\"register_victory\")"),
              ("GameManager.has_level(current_level + 1)", "bool(_game_manager().call(\"has_level\", current_level + 1))"),
              ("GameManager.register_defeat()", "_game_manager().call(\"register_defeat\")"),
              ("GameManager.is_level_unlocked(next_level)", "bool(_game_manager().call(\"is_level_unlocked\", next_level))"),
          ])
          text = main_game.read_text(encoding="utf-8")
          marker = "var hud: GameHUD\n"
          helper = "\nfunc _game_manager() -> Variant:\n\treturn get_node(\"/root/GameManager\")\n"
          if "func _game_manager() -> Variant:" not in text:
              text = text.replace(marker, marker + helper)
              main_game.write_text(text, encoding="utf-8")

          for relative_path in [
              "scripts/bases/BaseSpawner.gd",
              "scripts/units/UnitGroup.gd",
              "scripts/ai/EnemyAI.gd",
          ]:
              path = Path(relative_path)
              text = path.read_text(encoding="utf-8")
              text = text.replace("GameManager.", "_game_manager().")
              marker = "class_name "
              if "func _game_manager() -> Variant:" not in text:
                  class_line_end = text.find("\n", text.find(marker))
                  insert_at = class_line_end + 1
                  helper = "\nfunc _game_manager() -> Variant:\n\treturn get_node(\"/root/GameManager\")\n"
                  text = text[:insert_at] + helper + text[insert_at:]
              path.write_text(text, encoding="utf-8")

          base_path = Path("scripts/bases/Base.gd")
          base_text = base_path.read_text(encoding="utf-8")
          old_base_colors = '''func _get_team_color() -> Color:
\tmatch team_id:
\t\t"player":
\t\t\treturn TeamManager.get_team_color(TeamManager.Team.PLAYER)
\t\t"enemy":
\t\t\treturn TeamManager.get_team_color(TeamManager.Team.ENEMY)
\t\t_:
\t\t\treturn TeamManager.get_team_color(TeamManager.Team.NEUTRAL)
'''
          new_base_colors = '''func _get_team_color() -> Color:
\tmatch team_id:
\t\t"player":
\t\t\treturn Color(0.12, 0.45, 1.0)
\t\t"enemy":
\t\t\treturn Color(1.0, 0.15, 0.12)
\t\t_:
\t\t\treturn Color(0.55, 0.55, 0.55)
'''
          base_text = base_text.replace(old_base_colors, new_base_colors)
          base_path.write_text(base_text, encoding="utf-8")

          unit_path = Path("scripts/units/UnitGroup.gd")
          unit_text = unit_path.read_text(encoding="utf-8")
          old_unit_colors = '''func _get_team_color() -> Color:
\tmatch team_id:
\t\t"player":
\t\t\treturn TeamManager.get_team_color(TeamManager.Team.PLAYER)
\t\t"enemy":
\t\t\treturn TeamManager.get_team_color(TeamManager.Team.ENEMY)
\t\t_:
\t\t\treturn TeamManager.get_team_color(TeamManager.Team.NEUTRAL)
'''
          new_unit_colors = '''func _get_team_color() -> Color:
\tmatch team_id:
\t\t"player":
\t\t\treturn Color(0.12, 0.45, 1.0)
\t\t"enemy":
\t\t\treturn Color(1.0, 0.15, 0.12)
\t\t_:
\t\t\treturn Color(0.55, 0.55, 0.55)
'''
          unit_text = unit_text.replace(old_unit_colors, new_unit_colors)
          unit_path.write_text(unit_text, encoding="utf-8")
          PY

      - name: Guardar correcciones
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/core/MainGame.gd scripts/bases/BaseSpawner.gd scripts/bases/Base.gd scripts/units/UnitGroup.gd scripts/ai/EnemyAI.gd
          git commit -m "Resolver dependencias de autoload en Godot headless"
          git push origin HEAD:test/verificar-bloques-1-12
